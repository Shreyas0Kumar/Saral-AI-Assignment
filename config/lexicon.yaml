# Deterministic title -> role_family lexicon.
#
# Matching is token-boundary aware and longest-match-wins over the *normalised*
# title core (see core/normalize.py:norm_title). An exact whole-title match
# scores 1.0; a longest-substring match scores 0.9; a single-token match scores
# 0.8. Anything else abstains and hands the title to the fallback classifier.
#
# The `ambiguous` list is the important part. A bare "engineer", "developer",
# "consultant", "sde" or "member of technical staff" carries no family
# information on its own -- in the Indian market these titles span every family
# in the taxonomy. Guessing on them is how a mechanical Design Engineer with
# AutoCAD ends up classified into a data role. They are routed through `context`
# (the entry's description plus skills_used) instead, and abstain if the context
# is empty too.

