[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saral-signals"
version = "1.0.0"
description = "Structured candidate signals and fit scoring for the SARAL hiring platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=1.24",
    "scipy>=1.10",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "psutil>=5.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Everything that drags torch in. Deliberately NOT in the served image.
eval = ["sentence-transformers>=2.5", "torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
saral = "saral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
