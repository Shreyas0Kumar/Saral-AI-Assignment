[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saral-signals"
version = "1.0.0"
description = "Structured candidate signals and fit scoring for the SARAL hiring platform"
requires-python = ">=3.11"
# Kept in step with requirements.txt on purpose. These are only resolved by a
# plain `pip install -e .`; the documented install and the Dockerfile both use
# `--no-deps` on top of requirements.txt.
dependencies = [
    "pydantic>=2.5,<3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "joblib>=1.3",
    # Same pin, and the same reason, as requirements.txt: a wider range
    # unpickles config/distilled_lr.joblib with an InconsistentVersionWarning.
    "scikit-learn>=1.6,<1.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Everything that drags torch in. Deliberately NOT in the served image.
eval = ["sentence-transformers>=2.5", "torch>=2.0", "transformers>=4.40"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
saral = "saral.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
